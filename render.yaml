services:
  - type: web
    name: seatdesk
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r requirements.txt && pip install "psycopg[binary]==3.2.3"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.16"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: LLM_MODE
        value: "mock"
      - key: GEMINI_API_KEY
        value: ""
      - key: CORS_ORIGINS
        value: "http://localhost:5500,https://seatdesk-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: seatdesk-db
          property: connectionString

  - type: web
    name: seatdesk-frontend
    runtime: static
    rootDir: web
    buildCommand: ""
    staticPublishPath: "."
    envVars: []

databases:
  - name: seatdesk-db
    databaseName: seatdesk
    user: seatdesk
    plan: free
    region: oregon
